<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regulamentos de campanha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --line:#e0dfd8; --line-strong:#cfcdc4;
  --ink:#24232a; --ink-2:#5d5b66; --ink-3:#8b8993;
  --primary:#533AB7; --primary-ink:#ffffff; --primary-soft:#eeeafb;
  --green:#1D9E75; --green-soft:#e3f4ee; --red:#E24B4A; --red-soft:#fdeaea;
  --amber:#BA7517; --amber-soft:#fbf0dc; --mark:#fff2a8;
  --shadow:0 1px 2px rgba(36,35,42,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a20; --card:#25242b; --line:#37353e; --line-strong:#4a4752;
    --ink:#ecebf0; --ink-2:#b4b2bd; --ink-3:#8b8993;
    --primary:#8f7ae6; --primary-ink:#16151b; --primary-soft:#2f2950;
    --green:#3cc497; --green-soft:#1d3a31; --red:#f07170; --red-soft:#432526;
    --amber:#e0a14a; --amber-soft:#3f3020; --mark:#6b5c12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a20; --card:#25242b; --line:#37353e; --line-strong:#4a4752;
  --ink:#ecebf0; --ink-2:#b4b2bd; --ink-3:#8b8993;
  --primary:#8f7ae6; --primary-ink:#16151b; --primary-soft:#2f2950;
  --green:#3cc497; --green-soft:#1d3a31; --red:#f07170; --red-soft:#432526;
  --amber:#e0a14a; --amber-soft:#3f3020; --mark:#6b5c12;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Sora,Inter,system-ui,sans-serif;margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.brand h1{font-size:17px}
.brand p{margin:0;color:var(--ink-3);font-size:12.5px}
.topbar .spacer{flex:1}
.quarter{display:flex;align-items:center;gap:8px}
.quarter label{color:var(--ink-2);font-size:13px}
select,input[type=text],textarea{background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
select{width:auto;padding-right:28px}
textarea{resize:vertical;line-height:1.55}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}

.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.body{display:grid;grid-template-columns:232px minmax(0,1fr) minmax(0,540px);min-height:0}
.menu-btn{display:none}
.pv-show{display:none}
.body.pv-hidden{grid-template-columns:232px minmax(0,1fr)}
.body.pv-hidden .preview{display:none}
.app.pv-off .pv-show{display:inline-flex}
.pv-bar .pv-hide{margin-left:4px}
.body.pv-hidden .main-inner{max-width:900px}
.side-backdrop{display:none}
.side{border-right:1px solid var(--line);padding:18px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.side .group{color:var(--ink-3);font-size:12px;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;color:var(--ink-2)}
.nav:hover{background:var(--card);color:var(--ink)}
.nav.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--primary),var(--shadow)}
.nav .count{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.side .foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.side .foot .btn.primary{justify-content:center;padding:11px 14px}
.side .foot .links{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}

.main{overflow:auto;padding:24px 28px 60px}
.main-inner{max-width:760px}
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
.head h2{font-size:21px}
.lead{color:var(--ink-2);margin:0 0 22px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field > span{font-size:13px;font-weight:500;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-3)}
.hint code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.row{display:flex;gap:12px}
.row > *{flex:1}

.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.date input{min-width:0}
.date{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.date{gap:2px;cursor:pointer}
.date:hover{border-color:var(--line-strong)}
.date > span{font-size:12px;color:var(--ink-3)}
.date input{background:transparent;border:0;border-radius:6px;padding:0;margin:0;font-family:Sora,Inter,sans-serif;font-size:16px;font-weight:600;width:100%;cursor:pointer}
.date:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.date input:focus{outline:none}
.date.manual{border-color:var(--amber);background:var(--amber-soft)}
.date em{font-style:normal;font-size:12px;color:var(--amber)}
.co{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px;margin-top:10px;font-weight:600;color:var(--ink);font-family:Sora,Inter,sans-serif;font-size:14px}
.co:hover{background:var(--card)}
.co .chev{display:inline-block;transition:transform .15s;color:var(--ink-3);font-size:16px;line-height:1;width:12px}
.co.open .chev{transform:rotate(90deg)}
.co .count{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400;font-family:Inter,sans-serif}
.co-items{display:flex;flex-direction:column;gap:2px;margin-left:12px;padding-left:8px;border-left:1px solid var(--line)}
.nav.add{color:var(--ink-3);font-size:13px}
.crumb{margin:0 0 2px;color:var(--ink-3);font-size:13px;width:100%}
.head{flex-wrap:wrap}
.model{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.model .grow{flex:1}
.nm{display:flex;align-items:center;gap:8px}
.paper .nomodel{font-family:Inter,sans-serif;font-size:11.5px;color:#8a5a10;background:#fbf0dc;border-radius:6px;padding:6px 10px;margin-bottom:12px}
input[type=date]{color:inherit}

.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.prize{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--card)}
.prize .ph{aspect-ratio:4/3;background:var(--bg);display:grid;place-items:center;position:relative;cursor:pointer;border:0;padding:0;width:100%}
.prize .ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.prize .ph .swap{position:absolute;inset:auto 6px 6px auto;background:rgba(36,35,42,.72);color:#fff;font-size:11.5px;border-radius:6px;padding:2px 7px;opacity:0;transition:opacity .15s}
.prize .ph:hover .swap,.prize .ph:focus-visible .swap{opacity:1}
.prize .ph .empty{color:var(--ink-3);font-size:12.5px;padding:10px;text-align:center}
.prize .pb{padding:10px;display:flex;flex-direction:column;gap:8px}
.prize textarea{min-height:92px;font-size:13px}
.prize input{font-size:13px}
.prize .pa{display:flex;justify-content:space-between}
.addtile{border:1.5px dashed var(--line-strong);border-radius:10px;background:transparent;color:var(--ink-2);min-height:180px;font-weight:500}
.addtile:hover{border-color:var(--primary);color:var(--primary)}

.cargo textarea{min-height:180px;font-size:13.5px}
.tbl-edit{overflow-x:auto;margin-top:8px}
.tbl-edit table{border-collapse:collapse;width:100%}
.tbl-edit td,.tbl-edit th{border:1px solid var(--line);padding:4px}
.tbl-edit th{background:var(--bg)}
.tbl-edit input{border:0;padding:6px;border-radius:4px;background:transparent;min-width:90px}
.tbl-edit input:focus{box-shadow:0 0 0 2px var(--primary-soft)}
.tbl-edit .x{width:30px;text-align:center}
.subcard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--bg)}

.people{width:100%;border-collapse:collapse}
.people th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:500;padding:0 6px 6px}
.people td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
.people td:first-child{width:170px}
.people td:last-child{width:40px;text-align:right}
.people input{border-color:transparent;background:transparent}
.people input:hover{border-color:var(--line)}
.tag{font-size:11.5px;border-radius:999px;padding:1px 8px;font-weight:500}
.tag.new{background:var(--green-soft);color:var(--green)}
.tag.chg{background:var(--amber-soft);color:var(--amber)}
.removed{margin-top:12px;font-size:13px;color:var(--ink-2);background:var(--red-soft);border-radius:8px;padding:8px 12px}

.gen{display:flex;flex-direction:column;gap:8px}
.gen .item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.gen .item .name{font-weight:600}
.gen .item .meta{font-size:12.5px;color:var(--ink-3)}
.gen .item .grow{flex:1}
.warn{font-size:12.5px;color:var(--amber)}

.preview{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.pv-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pv-bar .grow{flex:1}
.pv-bar label.tg{display:flex;align-items:center;gap:6px;cursor:pointer}
.pv-scroll{overflow:auto;padding:22px 18px 60px;flex:1}
.paper{background:#fff;color:#111;max-width:520px;margin:0 auto;padding:30px 34px 26px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);border-radius:2px;font-family:"Times New Roman",Times,serif;font-size:11.5px;line-height:1.38}
.paper .logo{height:26px;margin-bottom:14px;display:block}
.paper .t{text-align:center;font-weight:700;font-size:16px;margin:4px 0 14px}
.paper .t span{background:#d9d9d9}
.paper p{margin:0 0 7px;text-align:justify}
.paper .h{font-weight:700;font-size:13px;margin:10px 0 6px}
.paper .hr{border:0;border-top:1.5px solid #a0a0a0;margin:10px 0}
.paper .st{font-weight:700;font-size:13px;margin:10px 0 4px}
.paper .cg{font-weight:700;margin:10px 0 4px}
.paper ol,.paper ul{margin:0 0 7px;padding-left:22px}
.paper li{margin:0 0 2px;text-align:justify}
.paper ul ul{list-style:circle}
.paper u{text-decoration-thickness:1px}
.paper table{border-collapse:collapse;width:100%;margin:6px 0 8px;font-size:10.5px}
.paper td,.paper th{border:1px solid #444;padding:3px 5px;vertical-align:middle;text-align:center}
.paper th{background:#e7e6e6}
.paper .vit img{max-width:100%;max-height:70px;display:block;margin:0 auto}
.paper .vit .pts{font-weight:700;font-size:11.5px}
.paper .sign{font-size:10.5px}
.paper .sign td,.paper .sign th{border:0;text-align:left}
.paper .sign th{background:transparent}
.paper .sign td.ln{border-bottom:1px solid #444;width:34%}
.paper .foot{margin-top:18px;border-top:1px solid #eee;padding-top:8px;text-align:center}
.paper .foot img{max-width:70%;height:auto}
.paper mark,.paper .mk{background:#fff2a8;color:inherit}
.paper.nomarks mark,.paper.nomarks .mk{background:transparent}
.paper .dim{color:#888;font-style:italic}

.mobile-tabs{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1360px){
  .pv-show,.app.pv-off .pv-show,.pv-bar .pv-hide{display:none}
  .body{grid-template-columns:232px minmax(0,1fr)}
  .preview{display:none}
  .body.show-pv .main{display:none}
  .body.show-pv .preview{display:flex;border-left:0}
  .mobile-tabs{display:flex;gap:4px;padding:8px 24px 0;background:var(--card);border-bottom:1px solid var(--line)}
  .mobile-tabs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500;margin-bottom:-1px}
  .mobile-tabs button.on{border-color:var(--primary);color:var(--ink)}
  .app{grid-template-rows:auto auto 1fr}
}
@media (max-width:820px){
  .topbar{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand p{display:none}
  .brand h1{font-size:16px}
  .menu-btn{display:inline-flex}
  .quarter{order:3;width:100%}
  .quarter label{display:none}
  .quarter select{flex:1;min-width:0}
  #themeBtn .tl{display:none}
  .body{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px rgba(0,0,0,.18)}
  .body.menu-open .side{transform:none}
  .body.menu-open .side-backdrop{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35)}
  .main{padding:18px 14px 60px}
  .pv-scroll{padding:14px 8px 60px}
  .paper{padding:20px 16px}
  .row{flex-direction:column}
  .mobile-tabs{padding:6px 14px 0}
  .card{padding:16px 14px}
  .people td:first-child{width:auto}
  .people td,.people th{padding-left:2px;padding-right:2px}
  .people input{padding:7px 4px}
  .prizes{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .gen .item{flex-wrap:wrap}
  .model{flex-direction:column;align-items:flex-start}
}
@media (max-width:480px){
  .people tr{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line);padding:4px 0}
  .people tr:first-child{display:none}
  .people td{border-top:0;width:auto!important}
  .people td:nth-child(1){grid-column:1}
  .people td:nth-child(2){grid-column:1}
  .people td:nth-child(3){grid-column:2;grid-row:1 / span 2;align-self:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="btn ghost menu-btn" id="menuBtn" type="button" aria-label="Abrir menu">☰</button>
    <div class="brand">
      <h1>Regulamentos de campanha</h1>
      <p>Fortes Tecnologia e F5 Automação Comercial</p>
    </div>
    <div class="spacer"></div>
    <div class="quarter">
      <label for="qsel">Trimestre</label>
      <select id="qsel"></select>
      <button class="btn" id="newq" type="button">+ Novo trimestre</button>
    </div>
    <button class="btn pv-show" id="pvShow" type="button">Mostrar pré-visualização</button>
    <button class="btn ghost" id="themeBtn" type="button" aria-pressed="false">☾ Modo escuro</button>
  </header>
  <div class="mobile-tabs" role="tablist">
    <button type="button" class="on" data-tab="edit">Editar</button>
    <button type="button" data-tab="pv">Pré-visualizar</button>
  </div>
  <div class="body" id="body">
    <nav class="side" id="side"></nav>
    <div class="side-backdrop" id="sideBackdrop"></div>
    <main class="main" id="main"><div class="main-inner" id="mainInner"></div></main>
    <aside class="preview" aria-label="Pré-visualização do documento">
      <div class="pv-bar">
        <span>Documento de</span>
        <select id="pvsel"></select>
        <span class="grow"></span>
        <label class="tg"><input type="checkbox" id="marks" checked> Destacar mudanças</label>
        <button type="button" class="btn ghost small pv-hide" id="pvHide" title="Ocultar pré-visualização" aria-label="Ocultar pré-visualização">✕</button>
      </div>
      <div class="pv-scroll"><div class="paper" id="paper"></div></div>
    </aside>
  </div>
</div>
<input type="file" id="imgIn" accept="image/*" class="sr">
<input type="file" id="modelIn" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="sr">
<input type="file" id="docsIn" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple class="sr">
<input type="file" id="bkIn" accept=".json,application/json" class="sr">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const CIDADE = 'Sobral';
const STORE_KEY = 'regcamp:v1';
const THEME_KEY = 'regcamp:tema';

/* ===== Tema claro / escuro ===== */
function systemDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const b = document.getElementById('themeBtn');
  if(b){ b.innerHTML = t==='dark' ? '☀︎<span class="tl"> Modo claro</span>' : '☾<span class="tl"> Modo escuro</span>'; b.setAttribute('aria-label', t==='dark' ? 'Mudar para modo claro' : 'Mudar para modo escuro'); }
}
let theme; try{ theme = localStorage.getItem(THEME_KEY); }catch(e){}
applyTheme(theme || (systemDark() ? 'dark' : 'light'));

/* ===== Estado ===== */
function migrate(d){
  if(!d || !d.trimestres || !d.trimestres.length) return null;
  if(d.versao===2) return d;
  // versão 1: um único bloco (F5) por trimestre
  const out = structuredClone(SEED); out.trimestres = [];
  const f5cfg = out.empresas.find(x=>x.id==='f5');
  d.trimestres.forEach(q=>{
    out.trimestres.push({ id:q.id, ano:q.ano, tri:q.tri, datas:null, emp:{
      f5:{ campanha:q.nome, premios:q.premios, setores:q.setores },
      fortes:{ campanha:'', premios:[], setores:[] } } });
  });
  return out;
}
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const d = migrate(JSON.parse(raw)); if(d) return d; } }catch(e){}
  return structuredClone(SEED);
}
let state = load();
function sorted(){ return [...state.trimestres].sort((a,b)=> (a.ano-b.ano) || (a.tri-b.tri)); }
function lastQuarter(){ const s = sorted(); return s[s.length-1]; }
let ui = { qid: state.atual || lastQuarter().id, view:'f5:geral', pv:null, marks:true, open:{f5:true} };
function Q(){ return state.trimestres.find(q=>q.id===ui.qid) || lastQuarter(); }
function prevQ(q){ const s = sorted(); const i = s.findIndex(x=>x.id===q.id); return i>0 ? s[i-1] : null; }
const CFG = id => state.empresas.find(x=>x.id===id);
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try{ state.atual = ui.qid; localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast('Não foi possível salvar neste navegador. Use “Exportar backup” para não perder as alterações.'); } }, 300);
}

/* ===== Datas ===== */
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
function datasAuto(q){
  return { ini: fmt(new Date(q.ano,(q.tri-1)*3,1)), fim: fmt(new Date(q.ano,q.tri*3,0)), ass: fmt(new Date(q.ano,(q.tri-1)*3,0)) };
}
function datas(q){ return { ...datasAuto(q), ...(q.datas||{}) }; }
const brToIso = s => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
const isoToBr = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };

/* ===== Utilidades ===== */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const xesc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $ = s => document.querySelector(s);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 4200); }
function slug(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,''); }
function maskCPF(v){ const d = v.replace(/\D/g,'').slice(0,11); let o = d.slice(0,3); if(d.length>3) o += '.'+d.slice(3,6); if(d.length>6) o += '.'+d.slice(6,9); if(d.length>9) o += '-'+d.slice(9); return o; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function inline(text){
  const out = []; const re = /\*\*(.+?)\*\*/g; let last = 0, m;
  while((m = re.exec(text))){ if(m.index>last) out.push({text:text.slice(last,m.index)}); out.push({text:m[1], b:true}); last = re.lastIndex; }
  if(last < text.length) out.push({text:text.slice(last)});
  return out;
}
function underlineLead(runs){
  const r0 = runs[0]; if(!r0 || r0.b) return runs;
  const i = r0.text.indexOf(':'); if(i<=0) return runs;
  return [{text:r0.text.slice(0,i), u:true}, {text:r0.text.slice(i)}, ...runs.slice(1)];
}
function parseView(v){ const [emp, sub] = (v||'').split(':'); return { emp, sub }; }

/* ===== Mudanças em relação ao trimestre anterior ===== */
function setorChanged(q, empId, s){
  const pq = prevQ(q); if(!pq || !pq.emp[empId]) return false;
  const ps = pq.emp[empId].setores.find(x=>x.id===s.id); if(!ps) return true;
  if(JSON.stringify(ps.cargos)!==JSON.stringify(s.cargos) || ps.titulo!==s.titulo) return true;
  const k = arr => arr.map(p=>p.cpf+p.nome).sort().join('|');
  return k(ps.participantes)!==k(s.participantes);
}
function campanhaChanged(q, empId){
  const pq = prevQ(q); if(!pq || !pq.emp[empId]) return false;
  const a = pq.emp[empId], b = q.emp[empId];
  const sig = e => JSON.stringify([e.campanha, e.premios.map(p=>[p.descricao,p.pontos,p.img.length])]);
  return sig(a)!==sig(b);
}
function datasChanged(q){ return !!q.datas && Object.keys(q.datas).length>0; }

/* ===== Modelos do Word por empresa ===== */
const tplCache = {};
function b64ToBytes(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
async function bytesToB64(u8){ return new Promise(r=>{ const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(new Blob([u8])); }); }
const NEUTRAL_SECT = SECT_PR.replace(/<w:headerReference[^>]*\/>|<w:footerReference[^>]*\/>/g,'');
async function firstImage(zip, kind){
  const rels = Object.keys(zip.files).filter(n=>new RegExp(`^word/_rels/${kind}\\d*\\.xml\\.rels$`).test(n)).sort();
  for(const r of rels){
    const x = await zip.file(r).async('string');
    const m = /Type="[^"]*\/image" Target="([^"]+)"/.exec(x) || /Target="([^"]+)"[^>]*Type="[^"]*\/image"/.exec(x);
    if(m){ const path = 'word/' + m[1].replace(/^\.\.\//,'').replace(/^\//,'').replace(/^word\//,''); const f = zip.file(path);
      if(f){ const ext = path.split('.').pop().toLowerCase(); if(!['png','jpg','jpeg','gif'].includes(ext)) continue;
        const blob = await f.async('blob'); return URL.createObjectURL(new Blob([blob], {type: ext==='png'?'image/png':ext==='gif'?'image/gif':'image/jpeg'})); } }
  }
  return null;
}
async function template(empId){
  const cfg = CFG(empId);
  const key = empId + ':' + (cfg.modelo ? cfg.modelo.length + cfg.modeloNome : 'base');
  if(tplCache[empId] && tplCache[empId].key===key) return tplCache[empId];
  let t;
  if(cfg.modelo){
    const bytes = b64ToBytes(cfg.modelo); const zip = await JSZip.loadAsync(bytes);
    const doc = await zip.file('word/document.xml').async('string');
    let head = doc.slice(0, doc.indexOf('<w:body>'));
    const sects = doc.match(/<w:sectPr[\s\S]*?<\/w:sectPr>/g) || [];
    const sect = sects.length ? sects[sects.length-1] : NEUTRAL_SECT;
    if(!/xmlns:wp=/.test(head)) head = head.replace('<w:document ', '<w:document xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ');
    if(!/xmlns:r=/.test(head)) head = head.replace('<w:document ', '<w:document xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
    t = { key, bytes, head, sect, logo: await firstImage(zip,'header'), foot: await firstImage(zip,'footer'), own:true };
  } else if(empId==='f5'){
    const bytes = b64ToBytes(BASE_DOCX_B64); const zip = await JSZip.loadAsync(bytes);
    t = { key, bytes, head:DOC_HEAD, sect:SECT_PR, logo: await firstImage(zip,'header'), foot: await firstImage(zip,'footer'), own:true };
  } else {
    t = { key, bytes:b64ToBytes(BASE_DOCX_B64), head:DOC_HEAD, sect:NEUTRAL_SECT, logo:null, foot:null, own:false };
  }
  tplCache[empId] = t; return t;
}
/* limpa um regulamento enviado: mantém cabeçalho, rodapé e estilos; descarta imagens e objetos do corpo */
async function cleanModel(file){
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  if(!zip.file('word/document.xml')) throw new Error('not-docx');
  const keep = new Set();
  for(const n of Object.keys(zip.files).filter(n=>/^word\/_rels\/(header|footer)\d*\.xml\.rels$/.test(n))){
    const x = await zip.file(n).async('string');
    for(const m of x.matchAll(/Target="([^"]+)"/g)) keep.add('word/' + m[1].replace(/^\.\.\//,'').replace(/^word\//,''));
  }
  const relPath = 'word/_rels/document.xml.rels';
  let rels = await zip.file(relPath).async('string');
  rels = rels.replace(/<Relationship [^>]*\/>/g, r=>{
    const tm = /Target="([^"]+)"/.exec(r); const ty = /Type="([^"]+)"/.exec(r);
    if(!tm || !ty) return r;
    if(/\/(image|oleObject|package|chart|diagramData|diagramLayout|diagramStyle|diagramColors|diagramDrawing)$/.test(ty[1])){ const full = 'word/' + tm[1].replace(/^\.\.\//,''); return keep.has(full) ? r : ''; }
    return r;
  });
  zip.file(relPath, rels);
  Object.keys(zip.files).forEach(n=>{ if((/^word\/(media|embeddings|charts|diagrams)\//.test(n)) && !keep.has(n)) zip.remove(n); });
  const doc = await zip.file('word/document.xml').async('string');
  const sects = doc.match(/<w:sectPr[\s\S]*?<\/w:sectPr>/g) || [];
  zip.file('word/document.xml', doc.slice(0, doc.indexOf('<w:body>')) + '<w:body><w:p/>' + (sects.length?sects[sects.length-1]:'') + '</w:body></w:document>');
  const out = await zip.generateAsync({type:'uint8array', compression:'DEFLATE'});
  return bytesToB64(out);
}

/* ===== Pré-visualização ===== */
function runsHTML(runs, blockMark){
  return runs.map(r=>{ let h = esc(r.text); if(r.u) h = `<u>${h}</u>`; if(r.b) h = `<b>${h}</b>`; if(r.mark && !blockMark) h = `<mark>${h}</mark>`; return h; }).join('');
}
async function renderPaper(){
  const q = Q(); const { emp, sub } = parseView(ui.pv || '');
  const paper = $('#paper'); paper.classList.toggle('nomarks', !ui.marks);
  const e = q.emp[emp]; const s = e && e.setores.find(x=>x.id===sub);
  if(!s){ paper.innerHTML = '<p class="dim">Escolha um setor para ver o documento.</p>'; return; }
  const B = buildDoc(q, emp, s);
  const tpl = await template(emp);
  let h = tpl.logo ? `<img class="logo" src="${tpl.logo}" alt="">` : (!tpl.own ? `<div class="nomodel">Sem cabeçalho e rodapé: envie um regulamento da ${esc(CFG(emp).rotulo)} em Word, na tela Campanha e prêmios.</div>` : '');
  const olCount = {}; let i = 0;
  while(i < B.length){
    const b = B[i];
    if(b.t==='li'){
      const key = b.list; const ordered = key!=='bullet';
      let html = ''; let open1 = false; let count = 0;
      while(i < B.length && B[i].t==='li' && B[i].list===key){
        const it = B[i]; const c = it.mark ? ' class="mk"' : '';
        if(it.lvl===1){ if(!open1){ html += '<ul>'; open1 = true; } }
        else { if(open1){ html += '</ul>'; open1 = false; } count++; }
        html += `<li${c}>${runsHTML(it.runs,it.mark)}</li>`; i++;
      }
      if(open1) html += '</ul>';
      if(!ordered) h += `<ul>${html}</ul>`;
      else if(count===0) h += `<div style="padding-left:22px">${html}</div>`;
      else { const start = (olCount[key]||0)+1; olCount[key] = (olCount[key]||0)+count; h += `<ol start="${start}">${html}</ol>`; }
      continue;
    }
    const mk = b.mark ? ' class="mk"' : '';
    switch(b.t){
      case 'title': h += `<div class="t"><span>${runsHTML(b.runs)}</span></div>`; break;
      case 'p': h += `<p${mk}${b.indent?' style="padding-left:24px"':''}>${runsHTML(b.runs,b.mark)}</p>`; break;
      case 'h': h += `<div class="h">${esc(b.text)}</div>`; break;
      case 'hr': h += '<hr class="hr">'; break;
      case 'setor': h += `<div class="st">${esc(b.text)}</div>`; break;
      case 'cargo': h += `<div class="cg"${mk}>${esc(b.text)}</div>`; break;
      case 'table': {
        const t = b.data; const p = b.prev; const cm = (v, pv) => (p && v!==pv) ? ' class="mk"' : '';
        h += `${t.titulo?`<p style="margin-top:6px"><b>${esc(t.titulo)}</b></p>`:''}<table><tr>${t.colunas.map((c,ci)=>`<th${cm(c,(p&&p.colunas||[])[ci])}>${esc(c)}</th>`).join('')}</tr>`;
        t.linhas.forEach((r,ri)=>{ h += `<tr>${r.map((c,ci)=>`<td${cm(c,((p&&p.linhas||[])[ri]||[])[ci])}>${esc(c)}</td>`).join('')}</tr>`; });
        h += `</table>${t.rodape?`<p${cm(t.rodape,p&&p.rodape)} style="text-align:center"><b>${esc(t.rodape)}</b></p>`:''}`;
        break; }
      case 'vitrine': {
        const pr = b.prev; const ch = (k, j) => pr ? (!pr[j] || pr[j][k]!==b.premios[j][k]) : false;
        h += `<table class="vit"><tr>${b.premios.map((p,j)=>`<td${ch('img',j)?' class="mk"':''}>${p.img?`<img src="${p.img}" alt="">`:'<span class="dim">sem foto</span>'}</td>`).join('')}</tr>`;
        h += `<tr>${b.premios.map((p,j)=>`<td${ch('descricao',j)?' class="mk"':''}>${esc(p.descricao)}</td>`).join('')}</tr>`;
        h += `<tr>${b.premios.map((p,j)=>`<td class="pts${ch('pontos',j)?' mk':''}">${esc(p.pontos)}</td>`).join('')}</tr></table>`;
        break; }
      case 'sign': {
        h += `<table class="sign"><tr><th>CPF</th><th>Nome</th><th>Assinatura</th></tr>`;
        b.rows.forEach(r=>{ const c = r.mark?' class="mk"':''; h += `<tr><td${c}>${esc(r.cpf)}</td><td${c}>${esc(r.nome)}</td><td class="ln"></td></tr>`; });
        if(!b.rows.length) h += `<tr><td colspan="3" class="dim">Nenhum participante cadastrado</td></tr>`;
        h += '</table>'; break; }
    }
    i++;
  }
  if(tpl.foot) h += `<div class="foot"><img src="${tpl.foot}" alt=""></div>`;
  paper.innerHTML = h;
}

/* ===== Word (WordprocessingML) ===== */
const FONT = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';
function rXML(r, o={}){
  const sz = o.sz || 24;
  return `<w:r><w:rPr>${FONT}${(r.b||o.b)?'<w:b/><w:bCs/>':''}${r.u?'<w:u w:val="single"/>':''}${o.hl?'<w:highlight w:val="lightGray"/>':''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xesc(r.text)}</w:t></w:r>`;
}
function pXML(runs, o={}){
  const ppr = [];
  if(o.num) ppr.push(`<w:numPr><w:ilvl w:val="${o.num.lvl}"/><w:numId w:val="${o.num.id}"/></w:numPr>`);
  if(o.keepNext) ppr.push('<w:keepNext/>');
  if(o.border) ppr.push('<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="1" w:color="A0A0A0"/></w:pBdr>');
  ppr.push(`<w:spacing w:before="${o.before??0}" w:after="${o.after??120}" w:line="${o.line??264}" w:lineRule="auto"/>`);
  if(o.ind) ppr.push(o.ind);
  ppr.push(`<w:jc w:val="${o.jc||'both'}"/>`);
  return `<w:p><w:pPr>${ppr.join('')}</w:pPr>${runs.map(r=>rXML(r,o)).join('')}</w:p>`;
}
function cellXML(w, inner, o={}){
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.borders||''}${o.shd?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>`:''}<w:vAlign w:val="center"/></w:tcPr>${inner}</w:tc>`;
}
const TBL_BORDERS = '<w:tblBorders><w:top w:val="single" w:sz="4" w:color="404040"/><w:left w:val="single" w:sz="4" w:color="404040"/><w:bottom w:val="single" w:sz="4" w:color="404040"/><w:right w:val="single" w:sz="4" w:color="404040"/><w:insideH w:val="single" w:sz="4" w:color="404040"/><w:insideV w:val="single" w:sz="4" w:color="404040"/></w:tblBorders>';
function tblXML(widths, rowsXML, borders=TBL_BORDERS){
  const W = widths.reduce((a,b)=>a+b,0);
  return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:jc w:val="center"/>${borders}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rowsXML}</w:tbl>`;
}
function pageWidth(sect){
  const w = /<w:pgSz [^>]*w:w="(\d+)"/.exec(sect), l = /<w:pgMar [^>]*w:left="(\d+)"/.exec(sect), r = /<w:pgMar [^>]*w:right="(\d+)"/.exec(sect);
  return (w && l && r) ? (+w[1] - +l[1] - +r[1]) : 9354;
}
function imgXML(rid, id, cx, cy){
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Premio ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="premio${id}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
function numberingXML(listIds){
  const lvl = (i, fmt, txt, left, font) => `<w:lvl w:ilvl="${i}"><w:start w:val="1"/><w:numFmt w:val="${fmt}"/><w:lvlText w:val="${txt}"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="${left}" w:hanging="360"/></w:pPr>${font?`<w:rPr><w:rFonts w:ascii="${font}" w:hAnsi="${font}" w:hint="default"/></w:rPr>`:''}</w:lvl>`;
  const abs0 = `<w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>${lvl(0,'bullet','\uF0B7',720,'Symbol')}${lvl(1,'bullet','o',1440,'Courier New')}</w:abstractNum>`;
  const abs1 = `<w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>${lvl(0,'decimal','%1.',720)}${lvl(1,'bullet','\uF0B7',1440,'Symbol')}</w:abstractNum>`;
  let nums = '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>';
  listIds.forEach(id=>{ nums += `<w:num w:numId="${id}"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>`; });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">${abs0}${abs1}${nums}</w:numbering>`;
}
function docBodyXML(B, PAGE_W){
  const listMap = {}; let nextId = 10; const media = []; let body = '';
  const numFor = key => key==='bullet' ? 1 : (listMap[key] ??= nextId++);
  for(const b of B){
    switch(b.t){
      case 'title': body += pXML(b.runs, {jc:'center', sz:36, b:true, hl:true, after:240}); break;
      case 'p': body += pXML(b.runs, {keepNext:b.keep, after: b.tight?40:120, before: b.space?240:0, ind: b.indent?'<w:ind w:left="567"/>':''}); break;
      case 'h': body += pXML([{text:b.text}], {sz:27, b:true, before:120, after:120, keepNext:true, jc:'left'}); break;
      case 'hr': body += pXML([], {border:true, before:60, after:200}); break;
      case 'setor': body += pXML([{text:b.text}], {sz:28, b:true, before:120, after:120, keepNext:true, jc:'left'}); break;
      case 'cargo': body += pXML([{text:b.text}], {b:true, before:200, after:80, keepNext:true, jc:'left'}); break;
      case 'li': body += pXML(b.runs, {num:{id:numFor(b.list), lvl:b.lvl}, after:40}); break;
      case 'table': {
        const t = b.data; const n = t.colunas.length || 1;
        const first = n>1 ? Math.round(PAGE_W*0.46) : PAGE_W; const rest = n>1 ? Math.floor((PAGE_W-first)/(n-1)) : 0;
        const widths = t.colunas.map((_,i)=> i===0 ? first : rest);
        const cell = (txt, i, o={}) => cellXML(widths[i], pXML([{text:txt}], {jc:i===0?'left':'center', after:0, line:240, b:o.b, sz:22}), o);
        let rows = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${t.colunas.map((c,i)=>cell(c,i,{b:true, shd:'E7E6E6'})).join('')}</w:tr>`;
        t.linhas.forEach(r=>{ rows += `<w:tr>${widths.map((_,i)=>cell(r[i]??'',i)).join('')}</w:tr>`; });
        if(t.titulo) body += pXML([{text:t.titulo, b:true}], {before:120, after:60, keepNext:true, jc:'left'});
        body += tblXML(widths, rows);
        body += t.rodape ? pXML([{text:t.rodape, b:true}], {jc:'center', before:80}) : pXML([], {after:60});
        break; }
      case 'vitrine': {
        const n = b.premios.length; const w = Math.floor(PAGE_W/n); const widths = Array(n).fill(w);
        const maxW = (w-200)*635, maxH = 1.15*914400;
        let r1 = '', r2 = '', r3 = '';
        b.premios.forEach((p,i)=>{
          let inner = '';
          if(p.img){
            const rid = `rIdPremio${i+1}`; media.push({rid, name:`premio${i+1}.jpg`, data:p.img.split(',')[1]});
            let cx = maxW, cy = Math.round(cx * (p.h||3)/(p.w||4));
            if(cy > maxH){ cy = maxH; cx = Math.round(cy * (p.w||4)/(p.h||3)); }
            inner = `<w:p><w:pPr><w:spacing w:before="60" w:after="60"/><w:jc w:val="center"/></w:pPr>${imgXML(rid, 100+i, Math.round(cx), Math.round(cy))}</w:p>`;
          } else inner = pXML([], {after:0});
          r1 += cellXML(w, inner);
          r2 += cellXML(w, pXML([{text:p.descricao}], {jc:'center', after:0, line:240, sz:20}));
          r3 += cellXML(w, pXML([{text:p.pontos}], {jc:'center', after:0, b:true, sz:26}));
        });
        body += tblXML(widths, `<w:tr><w:trPr><w:cantSplit/></w:trPr>${r1}</w:tr><w:tr>${r2}</w:tr><w:tr>${r3}</w:tr>`);
        body += pXML([], {after:60});
        break; }
      case 'sign': {
        const widths = [Math.round(PAGE_W*.225), Math.round(PAGE_W*.48)]; widths.push(PAGE_W - widths[0] - widths[1]);
        const none = '<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>';
        const line = '<w:tcBorders><w:bottom w:val="single" w:sz="4" w:space="0" w:color="auto"/></w:tcBorders>';
        const c = (txt,i,o={}) => cellXML(widths[i], pXML([{text:txt}], {jc:'left', after:0, line:240, b:o.b, sz:22, keepNext:true}), o);
        let rows = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${c('CPF',0,{b:true})}${c('Nome',1,{b:true})}${c('Assinatura',2,{b:true})}</w:tr>`;
        b.rows.forEach(r=>{ rows += `<w:tr><w:trPr><w:trHeight w:val="440"/></w:trPr>${c(r.cpf,0)}${c(r.nome,1)}${c('',2,{borders:line})}</w:tr>`; });
        body += tblXML(widths, rows, none);
        break; }
    }
  }
  body += pXML([], {after:0});
  return { body, listIds:Object.values(listMap), media };
}
async function makeDocx(q, empId, s){
  const tpl = await template(empId);
  const zip = await JSZip.loadAsync(tpl.bytes);
  const { body, listIds, media } = docBodyXML(buildDoc(q, empId, s), pageWidth(tpl.sect));
  zip.file('word/document.xml', tpl.head + '<w:body>' + body + tpl.sect + '</w:body></w:document>');
  zip.file('word/numbering.xml', numberingXML(listIds));
  let rels = await zip.file('word/_rels/document.xml.rels').async('string');
  rels = rels.replace(/<Relationship [^>]*Id="rIdPremio\d+"[^>]*\/>/g,'');
  if(!/\/numbering"/.test(rels)) rels = rels.replace('</Relationships>', '<Relationship Id="rIdNumeracao" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>');
  rels = rels.replace('</Relationships>', media.map(m=>`<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join('') + '</Relationships>');
  zip.file('word/_rels/document.xml.rels', rels);
  media.forEach(m=> zip.file('word/media/'+m.name, m.data, {base64:true}));
  let ct = await zip.file('[Content_Types].xml').async('string');
  if(!/Extension="jpg"/i.test(ct)) ct = ct.replace('<Default Extension="xml"', '<Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="xml"');
  if(!/\/word\/numbering\.xml/.test(ct)) ct = ct.replace('</Types>', '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>');
  zip.file('[Content_Types].xml', ct);
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE'});
}

/* ===== Download (claude.ai ou navegador comum) ===== */
let dlApi;
async function getDl(){
  if(dlApi !== undefined) return dlApi;
  try{ dlApi = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ dlApi = null; }
  return dlApi;
}
async function saveFile(name, blob){
  const dl = await getDl();
  if(dl){
    try{ await dl.save({filename:name, data:blob}); toast(`${name} pronto.`); }
    catch(e){ if(e && e.code==='declined') return; toast('Não foi possível baixar o arquivo aqui. Tente abrir o app em outra aba.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ===== Importar regulamentos em Word ===== */
let pendingDocs = null;
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const norm = t => (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,' ').trim().toUpperCase();
function wAttr(el, name){ return el ? (el.getAttributeNS(W_NS, name) ?? el.getAttribute('w:'+name)) : null; }
function kids(el, name){ return [...el.childNodes].filter(n=>n.nodeType===1 && n.localName===name); }
function paraInfo(p){
  const ppr = kids(p,'pPr')[0]; const numPr = ppr && kids(ppr,'numPr')[0];
  const ilvl = numPr ? +(wAttr(kids(numPr,'ilvl')[0],'val') || 0) : null;
  const segs = [];
  p.querySelectorAll('r').forEach(r=>{
    if(r.closest('*') && r.parentNode && r.parentNode.localName==='rPr') return;
    let t = ''; r.childNodes.forEach(n=>{ if(n.localName==='t') t += n.textContent; else if(n.localName==='tab') t += ' '; else if(n.localName==='br') t += ' '; });
    if(!t) return;
    const rpr = kids(r,'rPr')[0]; const bEl = rpr && kids(rpr,'b')[0]; const bv = wAttr(bEl,'val');
    const bold = !!bEl && bv!=='0' && bv!=='false';
    const last = segs[segs.length-1];
    if(last && last.b===bold) last.t += t; else segs.push({t, b:bold});
  });
  const plain = segs.map(x=>x.t).join('').replace(/\s+/g,' ').trim();
  const md = segs.map(x=> x.b && x.t.trim() ? x.t.replace(/^(\s*)(.*?)(\s*)$/, (m,a,c,z)=>`${a}**${c}**${z}`) : x.t).join('').replace(/\s+/g,' ').trim();
  const allBold = segs.length>0 && segs.filter(x=>x.t.trim()).every(x=>x.b);
  return { plain, md, ilvl, allBold };
}
function tableRows(tbl){ return kids(tbl,'tr').map(tr=> kids(tr,'tc').map(tc=> [...tc.querySelectorAll('p')].map(p=>paraInfo(p).plain).join(' ').trim())); }
const PREP = new Set(['DE','DA','DO','DAS','DOS','E','EM','A','O']);
function titleCase(t){ return t.split(/\s+/).map((w,i)=>{ const up = w.toUpperCase(); if(i>0 && PREP.has(up)) return w.toLowerCase(); if(/^\(?[A-Z0-9]{2,3}\)?$/.test(w) && !PREP.has(up.replace(/[()]/g,''))) return w; return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); }).join(' '); }
const isCaps = t => { const l = t.replace(/[^A-Za-zÀ-ÿ]/g,''); return l.length>2 && l===l.toUpperCase(); };
async function parseRegulamento(file){
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const xml = await zip.file('word/document.xml').async('string');
  const dom = new DOMParser().parseFromString(xml, 'application/xml');
  const body = dom.getElementsByTagNameNS(W_NS,'body')[0];
  const blocks = [];
  const walk = el => kids(el,'*').length; // noop
  [...body.childNodes].forEach(n=>{
    if(n.nodeType!==1) return;
    if(n.localName==='p') blocks.push({k:'p', ...paraInfo(n)});
    else if(n.localName==='tbl') blocks.push({k:'tbl', rows:tableRows(n)});
    else if(n.localName==='sdt'){ n.querySelectorAll('p').forEach(p=>blocks.push({k:'p', ...paraInfo(p)})); }
  });
  const out = { campanha:'', setorTitulo:'', cargos:[], participantes:[] };
  const titleP = blocks.find(b=>b.k==='p' && /regulamento da campanha/i.test(b.plain));
  if(titleP){ const m = /campanha\s*[–—-]\s*(.+)$/i.exec(titleP.plain); if(m) out.campanha = m[1].trim(); }
  let i0 = blocks.findIndex(b=>b.k==='p' && /crit[ée]rios espec[íi]ficos/i.test(b.plain));
  if(i0<0) i0 = blocks.findIndex(b=>b.k==='p' && /^3\.\s/.test(b.plain));
  let i1 = blocks.findIndex((b,i)=> i>i0 && b.k==='p' && /^4\.\s*Premia/i.test(b.plain));
  if(i1<0) i1 = blocks.length;
  let cargo = null; const lines = () => cargo.linhas;
  const newCargo = t => { cargo = { titulo:t, linhas:[], tabela:null }; out.cargos.push(cargo); };
  for(let i = i0+1; i < i1; i++){
    const b = blocks[i];
    if(b.k==='tbl'){
      if(b.rows.length>1){ if(!cargo) newCargo('Geral'); const cols = b.rows[0]; cargo.tabela = { titulo:'', colunas:cols, linhas:b.rows.slice(1).map(r=>cols.map((_,j)=>r[j]??'')), rodape:'' }; }
      continue;
    }
    if(!b.plain) continue;
    if(b.ilvl===null && !out.setorTitulo && (isCaps(b.plain) || b.allBold) && b.plain.length<60){ out.setorTitulo = b.plain.replace(/[:.]\s*$/,'').trim(); continue; }
    if(b.ilvl===null && b.plain.length<=90 && (isCaps(b.plain) || b.allBold) && !/^(os indicadores|gatilho|limite|c[áa]lculo)/i.test(b.plain)){
      newCargo(titleCase(b.plain.replace(/[:.]\s*$/,'').trim()));
      continue;
    }
    if(!cargo) newCargo('Geral');
    if(/^tabela [\wÀ-ÿ]+:?$/i.test(b.plain)) continue;
    if(b.ilvl===0) lines().push('- '+b.md);
    else if(b.ilvl>=1) lines().push('-- '+b.md);
    else if(/^[•·▪-]\s*/.test(b.plain)) lines().push('-- '+b.md.replace(/^[•·▪-]\s*/,''));
    else lines().push(b.md);
  }
  out.cargos = out.cargos.filter(c=>c.linhas.length || c.tabela).map(c=>({ titulo:c.titulo, texto:c.linhas.join('\n'), tabela:c.tabela }));
  const sig = [...blocks].reverse().find(b=>b.k==='tbl' && b.rows.length && b.rows[0].some(c=>/cpf/i.test(c)) && b.rows[0].some(c=>/nome/i.test(c)));
  if(sig){
    const h = sig.rows[0]; const ic = h.findIndex(c=>/cpf/i.test(c)), inn = h.findIndex(c=>/nome/i.test(c));
    sig.rows.slice(1).forEach(r=>{ const cpf = (r[ic]||'').trim(), nome = (r[inn]||'').trim(); if(cpf || nome) out.participantes.push({cpf:maskCPF(cpf), nome:nome.toUpperCase()}); });
  }
  if(!out.setorTitulo) out.setorTitulo = file.name.replace(/\.docx$/i,'').replace(/[_-]+/g,' ');
  return out;
}
const toNome = t => { const n = t.replace(/\(.*?\)/g,'').trim(); const m = /\(([^)]+)\)/.exec(t); if(m && m[1].length<=5) return m[1].toUpperCase(); return n.toLowerCase().replace(/(^|\s)(\S)/g,(x,a,c)=>a+c.toUpperCase()).replace(/\b(De|Da|Do|E)\b/g,w=>w.toLowerCase()); };
$('#docsIn').addEventListener('change', async ev=>{
  const files = [...ev.target.files]; const empId = pendingDocs; pendingDocs = null;
  if(!files.length || !empId) return;
  const q = Q(); const e = q.emp[empId]; const cfg = CFG(empId);
  const done = [], updated = [], failed = [];
  for(const f of files){
    try{
      const r = await parseRegulamento(f);
      if(!r.cargos.length && !r.participantes.length) throw new Error('vazio');
      const key = norm(r.setorTitulo);
      let s = e.setores.find(x=> norm(x.titulo)===key || norm(x.nome)===key || norm(x.nome)===norm(toNome(r.setorTitulo)));
      if(s){ s.cargos = r.cargos; s.participantes = r.participantes; s.titulo = r.setorTitulo.toUpperCase(); updated.push(s.nome); }
      else { const nome = toNome(r.setorTitulo); s = { id: slug(nome).toLowerCase()+'-'+uid(), nome, titulo:r.setorTitulo.toUpperCase(), cargos:r.cargos, participantes:r.participantes }; e.setores.push(s); done.push(nome); }
      if(!e.campanha && r.campanha) e.campanha = r.campanha;
      if(!cfg.modelo && empId!=='f5'){ try{ cfg.modelo = await cleanModel(f); cfg.modeloNome = f.name; delete tplCache[empId]; }catch(err){} }
      ui.view = `${empId}:${s.id}`; ui.pv = ui.view;
    }catch(err){ console.error(err); failed.push(f.name); }
  }
  ui.open[empId] = true; save(); renderAll();
  const msg = [];
  if(done.length) msg.push(`Setores criados: ${done.join(', ')}.`);
  if(updated.length) msg.push(`Setores atualizados: ${updated.join(', ')}.`);
  if(failed.length) msg.push(`Não consegui ler: ${failed.join(', ')}.`);
  toast(msg.join(' ') + (done.length||updated.length ? ' Confira os critérios importados.' : ''));
});
$('#bkIn').addEventListener('change', ev=>{
  const f = ev.target.files[0]; if(!f) return;
  f.text().then(t=>{ const d = migrate(JSON.parse(t)); if(!d) throw 0;
    if(!confirm('Substituir os dados atuais pelos do backup?')) return;
    state = d; ui.qid = lastQuarter().id; ui.view = 'f5:geral'; save(); renderAll(); toast('Backup importado.');
  }).catch(()=> toast('Arquivo de backup inválido.'));
});

renderAll();

</script>
